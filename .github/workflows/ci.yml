# Replaces .travis.yml. travis-ci.org stopped building open source repositories, and
# that config deployed to react-todo-board.herokuapp.com (now 404) with an encrypted
# Heroku API key that has been dead just as long. It also ran `echo "skipping tests"`
# where the tests should have been, and set CI=false, which is what stopped Create
# React App reporting the eqeqeq, unused-import and jsx-a11y warnings it had found.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Two runtimes on purpose. Node 12 is what this project was written against and the
    # only one where the build works unmodified, since Create React App 3 uses webpack 4,
    # which asks OpenSSL for MD4 and OpenSSL 3 (Node 17+) does not provide it. Node 12 is
    # also long past end of life, so it must not be the only thing this is proven against:
    # the second entry runs everything on a current Node with the
    # NODE_OPTIONS=--openssl-legacy-provider workaround the README tells readers to use,
    # so CI verifies that instruction rather than just asserting it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '12'
            node_options: ''
          - node: '22'
            node_options: '--openssl-legacy-provider'
    env:
      NODE_OPTIONS: ${{ matrix.node_options }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      # --frozen-lockfile so CI installs exactly what yarn.lock pins and fails if
      # package.json and the lockfile disagree.
      - run: yarn install --frozen-lockfile

      - run: yarn run lint
      - run: yarn test --watchAll=false
      # CI is set by GitHub Actions and deliberately left alone.
      - run: yarn run build
